<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="全国の謎を旅のきっかけにする観光アプリ。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>全国観光謎アプリ</title>
    <style>
      /* React 起動前の初期表示（D-50 / t165u / F5安定）。最終の探索画面と同じ配置・色・
         部品（ロゴ／ナビアイコン／折りたたみ／アカウント）を先に出し、中身だけが後から埋まる形にする。
         寸法は App.css の PC サイドバー（--pc-sidebar-w: 280px、brand 52、nav 96）と
         スマホ全画面地図＋シート＋タブに合わせる。 */
      html, body { margin: 0; min-width: 320px; background: #c5e8f5; color: #1d1d1b;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
      #root { min-height: 100dvh; }
      .boot-shell { position: fixed; inset: 0; background: #c5e8f5; color: #1d1d1b; }
      .boot-status { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #52524b; }
      .boot-dot { flex: none; width: 10px; height: 10px; border: 2px solid #1d1d1b; border-radius: 50%; background: #ffe66b; animation: boot-pulse 900ms ease-in-out infinite alternate; }
      .boot-skeleton { background: #c7ed93; animation: boot-skeleton-pulse 1200ms ease-in-out infinite alternate; }
      @keyframes boot-pulse { from { transform: scale(.7); opacity: .5; } to { transform: scale(1); opacity: 1; } }
      @keyframes boot-skeleton-pulse { from { opacity: .45; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot-dot, .boot-skeleton { animation: none; } }
      .boot-icon { flex: none; width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

      /* スマホ：全画面地図色＋浮きブランド＋下部シート＋タブバー */
      .boot-frame-pc { display: none; }
      .boot-account {
        position: absolute; top: calc(6px + env(safe-area-inset-top, 0px)); right: 10px; z-index: 3;
        width: 44px; height: 44px; box-sizing: border-box;
        border: 2px solid #1d1d1b; border-radius: 50%; background: #ffffff;
        display: grid; place-items: center; color: #1d1d1b;
      }
      .boot-account .boot-icon { width: 20px; height: 20px; }
      .boot-brand-chip { position: absolute; top: 12px; left: 12px; z-index: 2; display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border-radius: 16px; background: #ffffff; border: 2px solid #1d1d1b; font-size: 13px; font-weight: 700; }
      .boot-brand-mark { width: 30px; height: 30px; border-radius: 12px; background: #c7ed93; border: 2px solid #1d1d1b; color: #1d1d1b; display: grid; place-items: center; box-sizing: border-box; }
      .boot-brand-mark .boot-icon { width: 18px; height: 18px; }
      .boot-sheet { position: absolute; left: 0; right: 0; bottom: 70px; height: 196px; box-sizing: border-box; padding: 12px 16px; background: #ffffff; border-top: 2px solid #1d1d1b; border-radius: 24px 24px 0 0; }
      .boot-handle { width: 44px; height: 5px; margin: 0 auto 14px; border-radius: 999px; background: #1d1d1b; opacity: .25; }
      .boot-row { height: 44px; margin-top: 10px; border-radius: 16px; }
      .boot-tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 70px; box-sizing: border-box; display: flex; gap: 8px; padding: 8px 12px; background: #ffffff; border-top: 2px solid #1d1d1b; }
      .boot-tab { flex: 1; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #52524b; background: #f3f2ec; }
      .boot-tab.is-active { background: #e9e8e2; color: #1d1d1b; font-weight: 800; }
      .boot-tab .boot-icon { width: 20px; height: 20px; }

      /* PC：左 280px フラットサイドバー＋右地図（Cursor Web 風、App.css と同寸） */
      @media (min-width: 981px) {
        .boot-frame-mobile { display: none; }
        .boot-frame-pc { display: block; }
        .boot-account { top: 10px; right: 20px; }
        .boot-sidebar { position: absolute; top: 0; left: 0; bottom: 0; width: 280px; background: #ffffff; border-right: 1px solid color-mix(in srgb, #1d1d1b 28%, transparent); box-sizing: border-box; }
        .boot-brand { display: flex; align-items: center; gap: 8px; width: 232px; height: 52px; padding: 0 8px; box-sizing: border-box; border-bottom: 1px solid color-mix(in srgb, #1d1d1b 22%, transparent); font-size: 13px; font-weight: 700; overflow: hidden; }
        .boot-brand-mark-pc { flex: none; width: 32px; height: 32px; border-radius: 12px; background: #c7ed93; border: 2px solid #1d1d1b; color: #1d1d1b; display: grid; place-items: center; box-sizing: border-box; }
        .boot-brand-mark-pc .boot-icon { width: 20px; height: 20px; }
        .boot-toggle { position: absolute; top: 4px; left: 232px; width: 44px; height: 44px; display: grid; place-items: center; color: #1d1d1b; }
        .boot-toggle .boot-icon { width: 20px; height: 20px; }
        .boot-nav { display: flex; flex-direction: column; gap: 2px; height: 96px; padding: 4px 8px; box-sizing: border-box; border-bottom: 1px solid color-mix(in srgb, #1d1d1b 22%, transparent); }
        .boot-nav span { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 10px; border-radius: 10px; font-size: 14px; color: #52524b; box-sizing: border-box; }
        .boot-nav .is-active { background: #e9e8e2; color: #1d1d1b; font-weight: 800; }
        .boot-panel { position: absolute; top: 148px; left: 0; right: 0; bottom: 0; padding: 10px 10px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
        .boot-pill { flex: none; width: 132px; height: 36px; border-radius: 999px; }
        .boot-panel .boot-status { flex: none; min-height: 28px; }
        .boot-panel .boot-row { flex: none; margin-top: 0; border-radius: 10px; height: 44px; }
        .boot-map { position: absolute; top: 0; left: 280px; right: 0; bottom: 0; background: #c5e8f5; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" role="status" aria-label="アプリを読み込み中">
        <div class="boot-account" aria-hidden="true">
          <svg class="boot-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 7.5a4 4 0 1 1-8 0 4 4 0 0 1 8 0"/><path d="M5 20v-1.2a7 7 0 0 1 14 0V20"/></svg>
        </div>
        <div class="boot-frame-mobile" aria-hidden="true">
          <span class="boot-brand-chip">
            <span class="boot-brand-mark">
              <svg class="boot-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17"/><path d="m15.8 8.2-1.7 5.1-5.1 1.7 1.7-5.1 5.1-1.7Z"/></svg>
            </span>
            全国観光謎アプリ
          </span>
          <div class="boot-sheet">
            <div class="boot-handle"></div>
            <p class="boot-status"><span class="boot-dot"></span>読み込み中…</p>
            <div class="boot-row boot-skeleton"></div>
            <div class="boot-row boot-skeleton"></div>
          </div>
          <div class="boot-tabbar">
            <div class="boot-tab is-active">
              <svg class="boot-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5.2a5.8 5.8 0 1 0 0 11.6 5.8 5.8 0 0 0 0-11.6"/><path d="m20.2 20.2-4-4"/></svg>
              謎を探す
            </div>
            <div class="boot-tab">
              <svg class="boot-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h5.2c.9 0 1.8.7 1.8 1.6 0-.9.9-1.6 1.8-1.6H19V19h-5.2c-.9 0-1.8.5-1.8 1.2 0-.7-.9-1.2-1.8-1.2H5V5.5Z"/><path d="M12 7.2v12.2"/></svg>
              自分の記録
            </div>
          </div>
        </div>
        <div class="boot-frame-pc" aria-hidden="true">
          <div class="boot-sidebar">
            <div class="boot-brand">
              <span class="boot-brand-mark-pc">
                <svg class="boot-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17"/><path d="m15.8 8.2-1.7 5.1-5.1 1.7 1.7-5.1 5.1-1.7Z"/></svg>
              </span>
              全国観光謎アプリ
            </div>
            <div class="boot-toggle" aria-hidden="true">
              <svg class="boot-icon" viewBox="0 0 24 24"><path d="M5.5 6.2c0-.9.7-1.6 1.6-1.6h9.8c.9 0 1.6.7 1.6 1.6v11.6c0 .9-.7 1.6-1.6 1.6H7.1c-.9 0-1.6-.7-1.6-1.6V6.2Z"/><path d="M9.5 4.6v14.8"/></svg>
            </div>
            <div class="boot-nav">
              <span class="is-active">
                <svg class="boot-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5.2a5.8 5.8 0 1 0 0 11.6 5.8 5.8 0 0 0 0-11.6"/><path d="m20.2 20.2-4-4"/></svg>
                謎を探す
              </span>
              <span>
                <svg class="boot-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h5.2c.9 0 1.8.7 1.8 1.6 0-.9.9-1.6 1.8-1.6H19V19h-5.2c-.9 0-1.8.5-1.8 1.2 0-.7-.9-1.2-1.8-1.2H5V5.5Z"/><path d="M12 7.2v12.2"/></svg>
                自分の記録
              </span>
            </div>
            <div class="boot-panel">
              <div class="boot-pill boot-skeleton" aria-hidden="true"></div>
              <p class="boot-status"><span class="boot-dot"></span>読み込み中</p>
              <div class="boot-row boot-skeleton"></div>
              <div class="boot-row boot-skeleton"></div>
              <div class="boot-row boot-skeleton"></div>
              <div class="boot-row boot-skeleton"></div>
              <div class="boot-row boot-skeleton"></div>
            </div>
          </div>
          <div class="boot-map" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
