<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="全国の謎を旅のきっかけにする観光アプリ。" />
    <title>全国観光謎アプリ</title>
    <style>
      /* React が起動するまでの初期表示（D-50）。アプリ側の CSS はまだ読まれていないため、
         テーマの色味だけをここに直接書く。本体が描画されると #root の中身ごと置き換わる。 */
      body { margin: 0; }
      .boot-splash { min-height: 100dvh; display: grid; place-items: center; background: #fffdf5; color: #1d1d1b; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
      .boot-card { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 28px 34px; border: 2px solid #1d1d1b; border-radius: 16px; background: #ffffff; box-shadow: 6px 6px 0 #ffe66b; }
      .boot-brand { font-size: 20px; font-weight: 700; letter-spacing: .02em; }
      .boot-status { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; }
      .boot-dot { width: 10px; height: 10px; border: 2px solid #1d1d1b; border-radius: 50%; background: #ffe66b; animation: boot-pulse 900ms ease-in-out infinite alternate; }
      @keyframes boot-pulse { from { transform: scale(.7); opacity: .5; } to { transform: scale(1); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot-dot { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-label="アプリを読み込み中">
        <div class="boot-card">
          <span class="boot-brand">全国観光謎アプリ</span>
          <p class="boot-status"><span class="boot-dot" aria-hidden="true"></span>読み込み中…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
